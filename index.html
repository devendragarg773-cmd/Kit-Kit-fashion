<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kit Kit Fashion</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <a href="#" class="logo" onclick="showHome()">
        KIT KIT <span>FASHION</span>
    </a>

    <nav>
        <button onclick="showHome()">Home</button>
        <button onclick="showCart()">
            Cart (<span id="cartCount">0</span>)
        </button>
        <button onclick="showSettings()">Settings</button>
    </nav>
</header>


<main>

    <!-- HOME -->
    <section id="homeSection">

        <div class="hero">
            <p class="small-title">KIT KIT FASHION</p>

            <h1>Style That Feels Like You.</h1>

            <p>
                Discover stylish clothing for everyday life.
            </p>

            <button class="primary-btn" onclick="scrollToProducts()">
                Shop Now
            </button>
        </div>

        <h2>Clothing Collection</h2>

        <div id="products" class="product-grid"></div>

    </section>


    <!-- PRODUCT -->
    <section id="productSection" class="hidden">

        <button class="back-btn" onclick="showHome()">← Back</button>

        <div id="productDetail"></div>

        <h2>You May Also Like</h2>

        <div id="relatedProducts" class="product-grid"></div>

    </section>


    <!-- CART -->
    <section id="cartSection" class="hidden">

        <button class="back-btn" onclick="showHome()">← Home</button>

        <h2>My Cart</h2>

        <div id="cartItems"></div>

        <div id="cartTotal" class="cart-total"></div>

        <button class="primary-btn" onclick="checkout()">
            Proceed to Checkout
        </button>

    </section>


    <!-- SETTINGS -->
    <section id="settingsSection" class="hidden">

        <h2>Settings</h2>

        <div class="settings-grid">

            <button class="owner-access-btn" onclick="ownerAccess()">
                <span>🔐</span>
                <strong>Owner Access</strong>
                <small>Open Owner Dashboard</small>
            </button>

            <button onclick="helpDesk()">
                ☎ Help / Helpline
            </button>

            <button onclick="complaint()">
                📝 Complaint / Feedback
            </button>

            <button onclick="myOrders()">
                📦 My Orders
            </button>

            <button onclick="storeLocation()">
                📍 Store Location
            </button>

            <button onclick="aboutUs()">
                ℹ About Us
            </button>

            <button onclick="privacy()">
                🔒 Privacy / Terms
            </button>

        </div>

    </section>


    <!-- OWNER DASHBOARD -->
    <section id="ownerSection" class="hidden">

        <button class="back-btn" onclick="showSettings()">
            ← Back
        </button>

        <div class="owner-title">
            <p>OWNER PANEL</p>
            <h2>Owner Dashboard</h2>
            <span>Manage your complete fashion store</span>
        </div>

        <div class="owner-grid">

            <button class="dashboard-card" onclick="openOwnerPage('products')">
                <span class="card-icon">👕</span>
                <h3>Products</h3>
                <p>Add, edit and manage clothing.</p>
            </button>

            <button class="dashboard-card" onclick="openOwnerPage('addProduct')">
                <span class="card-icon">➕</span>
                <h3>Add Product</h3>
                <p>Add new clothes and stock.</p>
            </button>

            <button class="dashboard-card" onclick="openOwnerPage('orders')">
                <span class="card-icon">📦</span>
                <h3>Customer Orders</h3>
                <p>Manage customer orders.</p>
            </button>

            <button class="dashboard-card" onclick="openOwnerPage('shipping')">
                <span class="card-icon">🚚</span>
                <h3>Shipping</h3>
                <p>Manage shipping status.</p>
            </button>

            <button class="dashboard-card" onclick="openOwnerPage('complaints')">
                <span class="card-icon">📝</span>
                <h3>Complaints</h3>
                <p>View customer complaints.</p>
            </button>

            <button class="dashboard-card" onclick="openOwnerPage('customers')">
                <span class="card-icon">👥</span>
                <h3>Customers</h3>
                <p>View customer information.</p>
            </button>

            <button class="dashboard-card" onclick="openOwnerPage('offers')">
                <span class="card-icon">🏷️</span>
                <h3>Offers</h3>
                <p>Manage store offers.</p>
            </button>

            <button class="dashboard-card" onclick="openOwnerPage('arrivals')">
                <span class="card-icon">✨</span>
                <h3>New Arrivals</h3>
                <p>Manage new clothing.</p>
            </button>

            <button class="dashboard-card" onclick="openOwnerPage('coins')">
                <span class="card-icon">🪙</span>
                <h3>ND's Coins</h3>
                <p>₹200 purchase = 8 coins.</p>
            </button>

            <button class="dashboard-card" onclick="openOwnerPage('storeSettings')">
                <span class="card-icon">⚙️</span>
                <h3>Store Settings</h3>
                <p>Manage shop details.</p>
            </button>

            <button class="dashboard-card" onclick="openOwnerPage('sales')">
                <span class="card-icon">📊</span>
                <h3>Sales</h3>
                <p>View sales information.</p>
            </button>

            <button class="dashboard-card" onclick="openOwnerPage('notifications')">
                <span class="card-icon">🔔</span>
                <h3>Notifications</h3>
                <p>Manage notifications.</p>
            </button>

        </div>

    </section>


    <!-- OWNER SUB PAGE -->
    <section id="ownerPageSection" class="hidden">

        <button class="back-btn" onclick="showOwner()">
            ← Owner Dashboard
        </button>

        <div id="ownerPageContent"></div>

    </section>

</main>


<footer>
    © 2026 Kit Kit Fashion
</footer>


<script src="script.js"></script>

</body>
</html>
