<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kit Kit Fashion</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <a href="/" class="logo">
        KIT KIT <span>FASHION</span>
    </a>

    <nav>

        <button onclick="showHome()">
            Home
        </button>

        <button onclick="showCart()">
            Cart (<span id="cartCount">0</span>)
        </button>

        <button onclick="showSettings()">
            Settings
        </button>

    </nav>

</header>


<main>

    <!-- ================= HOME ================= -->

    <section id="homeSection">

        <div class="hero">

            <p class="small-title">
                KIT KIT FASHION
            </p>

            <h1>
                Style That Feels Like You.
            </h1>

            <p>
                Discover stylish clothing for everyday life.
            </p>

            <button
                class="primary-btn"
                onclick="scrollToProducts()"
            >
                Shop Now
            </button>

        </div>


        <h2>
            Clothing Collection
        </h2>

        <div
            id="products"
            class="product-grid"
        ></div>

    </section>


    <!-- ================= PRODUCT DETAILS ================= -->

    <section
        id="productSection"
        class="hidden"
    >

        <button
            class="back-btn"
            onclick="showHome()"
        >
            ← Back
        </button>

        <div id="productDetail"></div>

        <h2>
            You May Also Like
        </h2>

        <div
            id="relatedProducts"
            class="product-grid"
        ></div>

    </section>


    <!-- ================= CART ================= -->

    <section
        id="cartSection"
        class="hidden"
    >

        <button
            class="back-btn"
            onclick="showHome()"
        >
            ← Continue Shopping
        </button>

        <h2>
            My Cart
        </h2>

        <div id="cartItems"></div>

        <div
            id="cartTotal"
            class="cart-total"
        ></div>

        <button
            class="primary-btn"
            onclick="checkout()"
        >
            Proceed to Checkout
        </button>

    </section>


    <!-- ================= SETTINGS ================= -->

    <section
        id="settingsSection"
        class="hidden"
    >

        <h2>
            Settings
        </h2>

        <div class="settings-grid">

            <button onclick="ownerAccess()">
                🔐 Owner Access
            </button>

            <button onclick="helpDesk()">
                ☎ Help / Helpline
            </button>

            <button onclick="complaint()">
                📝 Complaint / Feedback
            </button>

            <button onclick="myOrders()">
                📦 My Orders
            </button>

            <button onclick="storeLocation()">
                📍 Store Location
            </button>

            <button onclick="aboutUs()">
                ℹ About Us
            </button>

            <button onclick="privacy()">
                🔒 Privacy / Terms
            </button>

        </div>

    </section>


    <!-- ================= OWNER PASSWORD LOGIN ================= -->

    <section
        id="ownerLoginSection"
        class="hidden"
    >

        <button
            class="back-btn"
            onclick="showSettings()"
        >
            ← Back
        </button>


        <div class="login-box">

            <h2>
                Owner Login
            </h2>

            <p>
                Enter owner password to continue.
            </p>


            <input
                type="password"
                id="ownerPassword"
                placeholder="Enter Owner Password"
                autocomplete="current-password"
            >


            <!-- FIXED: ownerLogin() -->

            <button
                class="primary-btn"
                onclick="ownerLogin()"
            >
                🔐 Login
            </button>


            <p
                id="ownerLoginMessage"
                class="muted"
            ></p>

        </div>

    </section>


    <!-- ================= OWNER DASHBOARD ================= -->

    <section
        id="ownerSection"
        class="hidden"
    >

        <button
            class="back-btn"
            onclick="ownerLogout()"
        >
            ← Logout
        </button>


        <h2>
            Owner Dashboard
        </h2>


        <div class="owner-grid">


            <!-- PRODUCTS -->

            <button
                class="dashboard-card"
                onclick="ownerProducts()"
            >

                <h3>
                    📦 Products
                </h3>

                <p>
                    Add, edit and manage clothing.
                </p>

            </button>


            <!-- ADD PRODUCT -->

            <button
                class="dashboard-card"
                onclick="addProduct()"
            >

                <h3>
                    ➕ Add Product
                </h3>

                <p>
                    Add new clothes and stock.
                </p>

            </button>


            <!-- ORDERS -->

            <button
                class="dashboard-card"
                onclick="customerOrders()"
            >

                <h3>
                    🛒 Customer Orders
                </h3>

                <p>
                    Manage customer orders.
                </p>

            </button>


            <!-- SHIPPING -->

            <button
                class="dashboard-card"
                onclick="shipping()"
            >

                <h3>
                    🚚 Shipping
                </h3>

                <p>
                    Manage shipping status.
                </p>

            </button>


            <!-- COMPLAINTS -->

            <button
                class="dashboard-card"
                onclick="complaintsOwner()"
            >

                <h3>
                    📝 Complaints
                </h3>

                <p>
                    View customer complaints.
                </p>

            </button>


            <!-- CUSTOMERS -->

            <button
                class="dashboard-card"
                onclick="customers()"
            >

                <h3>
                    👥 Customers
                </h3>

                <p>
                    View customer information.
                </p>

            </button>


            <!-- OFFERS -->

            <button
                class="dashboard-card"
                onclick="offers()"
            >

                <h3>
                    🏷️ Offers
                </h3>

                <p>
                    Manage store offers.
                </p>

            </button>


            <!-- NEW ARRIVALS -->

            <button
                class="dashboard-card"
                onclick="newArrivals()"
            >

                <h3>
                    🆕 New Arrivals
                </h3>

                <p>
                    Manage new clothing.
                </p>

            </button>


            <!-- ND'S COINS -->

            <button
                class="dashboard-card"
                onclick="ndsCoins()"
            >

                <h3>
                    🪙 ND's Coins
                </h3>

                <p>
                    ₹200 eligible purchase = 8 coins.
                </p>

            </button>


            <!-- STORE SETTINGS -->

            <button
                class="dashboard-card"
                onclick="storeSettings()"
            >

                <h3>
                    ⚙️ Store Settings
                </h3>

                <p>
                    Manage shop details and location.
                </p>

            </button>


            <!-- SALES -->

            <button
                class="dashboard-card"
                onclick="sales()"
            >

                <h3>
                    📊 Sales
                </h3>

                <p>
                    View sales information.
                </p>

            </button>


            <!-- NOTIFICATIONS -->

            <button
                class="dashboard-card"
                onclick="notifications()"
            >

                <h3>
                    🔔 Notifications
                </h3>

                <p>
                    Manage notifications.
                </p>

            </button>


        </div>


        <!-- OWNER CONTENT -->

        <div id="ownerContent"></div>

    </section>

</main>


<!-- ================= FOOTER ================= -->

<footer>

    © 2026 Kit Kit Fashion

</footer>


<!-- ================= JAVASCRIPT ================= -->

<script src="script.js"></script>

</body>

            </html>
